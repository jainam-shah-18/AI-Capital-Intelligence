version: 2

sources:
  - name: aci_analytics
    database: ACI_DB
    schema: ANALYTICS
    description: "Verified upstream SEC financial observations."
    tables:
      - name: int_financial_observations
        description: "Canonical financial observations with SEC filing provenance and period classifications."

  - name: aci_monitoring
    database: ACI_DB
    schema: MONITORING
    description: "Operational pipeline execution monitoring."
    tables:
      - name: pipeline_run_log
        description: "Actual SEC pipeline component execution history and statuses."