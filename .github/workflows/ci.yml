
name: ACI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aci-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Python Tests and Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -f Dockerfile -t ai-capital-intelligence:ci .

      - name: Verify Docker image
        run: >-
          docker run --rm --entrypoint python ai-capital-intelligence:ci
          -c "import requests, pandas, pyarrow, boto3, dotenv; import src.aci.pipeline; print('ACI Docker image verification: SUCCESS')"
